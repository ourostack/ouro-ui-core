name: Release

# Push a tag vX.Y.Z that matches package.json's version. This rebuilds dist/, proves it, and
# attaches it to the GitHub release for that tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm tokens
      - run: pnpm tokens:parity --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm test
      - run: pnpm apple:check
      - name: Package dist/
        run: |
          cd dist && zip -qr "../ouro-ui-core-$GITHUB_REF_NAME-dist.zip" . && cd ..
          cp dist/web/ouro-theme.css dist/web/ouro-base.css dist/apple/OuroTokens.swift dist/ax/apple.claims.json dist/swatches.html dist/dist-manifest.json .
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Ouro UI core $GITHUB_REF_NAME" --notes "Generated from tokens/ at $GITHUB_REF_NAME. dist-manifest.json lists every file in dist/ with its SHA-256, for core-provenance.json. dist/web/ is byte-identical to web's files at the tag in parity.json. apple.claims.json is Ouro AX for Apple's claim set." \
            "ouro-ui-core-$GITHUB_REF_NAME-dist.zip" ouro-theme.css ouro-base.css OuroTokens.swift apple.claims.json swatches.html dist-manifest.json
